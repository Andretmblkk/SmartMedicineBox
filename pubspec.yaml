name: medicinetreatment
description: "Smart Medicine Tracker - Track your medications and stay healthy."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  firebase_core: ^3.13.0
  firebase_database: ^11.3.4
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  lottie: ^3.3.1
  shared_preferences: ^2.5.5
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/kotakobat.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
